{{- if .Values.ingress.enabled }}
# The public ALB (AWS Load Balancer Controller). Backends reference the data plane Service and its
# port only. Port 8081 must never appear here (spec §2) — deploy/helm/verify-render.py checks.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "proxy.fullname" . }}
  labels:
    {{- include "proxy.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "proxy.fullname" $ }}
                port:
                  name: data-plane
    {{- end }}
{{- end }}
