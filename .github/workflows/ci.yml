name: CI

# Build, test, style gate, and Helm chart verification on every push and pull request.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Format check
        run: dotnet format --no-restore --verify-no-changes

      # Integration tests start real Kestrel listeners on loopback. Redis via Testcontainers arrives
      # in Phase 3; ubuntu-latest runners provide Docker for it.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint deploy/helm/proxy

      # Render for each deployed environment and check the manifests, not the values (roadmap
      # Phase 1 "watch for": port 8081 must never be in the ALB target group).
      - name: Render and verify (dev)
        run: |
          deploy/helm/stage-config.sh dev
          helm template proxy deploy/helm/proxy --set image.tag=${{ github.sha }} \
            --set ingress.enabled=true --set 'ingress.hosts[0]=*.dev.corp.example.com' \
            | python3 deploy/helm/verify-render.py

      - name: Render and verify (prod)
        run: |
          deploy/helm/stage-config.sh prod
          helm template proxy deploy/helm/proxy --set image.tag=${{ github.sha }} \
            --set ingress.enabled=true --set 'ingress.hosts[0]=*.corp.example.com' \
            | python3 deploy/helm/verify-render.py
