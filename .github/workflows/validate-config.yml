name: Validate config

# Required check on every PR touching config/ (spec §4.4).
#
# This runs tools/ConfigValidator — the exact same validation code the proxy runs at startup.
# Do NOT reimplement validation here as a script: two implementations drift, and the one that
# drifts is the one enforcing the destination allowlist.
#
# Make this a required branch protection check.

on:
  push:
    branches: [master, main]
    paths: ["config/**", "src/Proxy.Config/**", "tools/ConfigValidator/**"]
  pull_request:
    paths: ["config/**", "src/Proxy.Config/**", "tools/ConfigValidator/**"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate route configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Routes are validated against every environment's destination allowlist.
      - name: Validate
        run: dotnet run --project tools/ConfigValidator --configuration Release -- config/routes --environments config/environments
