application: app
owner: team
routes:
  - routeId: app
    match:
      hosts: [app.corp.example.com]
      path: "{**catch-all}"
    clusterId: does-not-exist
    authorizationPolicy: anonymous
clusters:
  - clusterId: app-svc
    destinations:
      primary:
        address: http://app.app.svc.cluster.local/
