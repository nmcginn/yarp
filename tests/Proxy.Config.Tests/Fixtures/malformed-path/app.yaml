application: app
owner: team
routes:
  - routeId: app
    match:
      hosts: [app.corp.example.com]
      path: "/api/{**rest}/{id}"
    clusterId: app-svc
    authorizationPolicy: anonymous
clusters:
  - clusterId: app-svc
    destinations:
      primary:
        address: http://app.app.svc.cluster.local/
